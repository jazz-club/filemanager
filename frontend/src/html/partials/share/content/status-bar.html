<div
  class="share-status-bar p-3 border-bottom border-dark bg-light d-flex justify-content-between align-items-center flex-wrap gap-2"
>
  <div class="share-status-badges d-flex align-items-center gap-2">
    <span
      class="badge bg-info text-dark font-monospace"
      id="share-badge-visibility"
      style="font-size: 0.75rem"
      >Public</span
    >
    <span
      class="badge bg-secondary font-monospace"
      id="share-badge-permission"
      style="font-size: 0.75rem"
      >View/Download</span
    >
  </div>
  <div class="d-flex align-items-center gap-3">
    <span
      class="text-muted small font-monospace d-none d-sm-inline"
      id="share-stats-summary"
    ></span>
    <span class="text-muted small" id="share-upload-date">Uploaded recently</span>
    <span
      id="share-expiry-countdown"
      class="text-muted small font-monospace d-none"
      style="font-size: 0.75rem"
    ></span>
  </div>
</div>
