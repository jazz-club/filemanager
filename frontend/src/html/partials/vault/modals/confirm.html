<div class="modal fade" id="confirmModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-sm">
    <div class="modal-content">
      <div class="modal-header">
        <h6 class="modal-title fw-bold mb-0" id="confirm-modal-title">Confirm</h6>
        <button
          type="button"
          class="btn-close-custom ms-auto"
          data-bs-dismiss="modal"
          aria-label="Close"
          title="Close"
        >
          ✕
        </button>
      </div>
      <div class="modal-body">
        <p class="mb-0 small" id="confirm-modal-body">Are you sure?</p>
      </div>
      <div class="modal-footer py-2">
        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">
          Cancel
        </button>
        <button type="button" class="btn btn-sm" id="confirm-modal-ok">Confirm</button>
      </div>
    </div>
  </div>
</div>
