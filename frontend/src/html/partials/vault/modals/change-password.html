<div class="modal fade" id="changePasswordModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fw-bold">Change Password</h5>
        <button
          type="button"
          class="btn-close-custom ms-auto"
          data-bs-dismiss="modal"
          aria-label="Close"
          title="Close"
        >
          ✕
        </button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label small fw-bold">Current Password</label>
          <div class="input-group">
            <input
              type="password"
              id="pw-current"
              class="form-control"
              autocomplete="current-password"
            />
            <button
              class="btn btn-white border-dark toggle-pw-btn"
              type="button"
              data-target="pw-current"
              title="Toggle visibility"
            >
              &#x25C9;
            </button>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label small fw-bold">New Password (min 8 chars)</label>
          <div class="input-group">
            <input type="password" id="pw-new" class="form-control" autocomplete="new-password" />
            <button
              class="btn btn-white border-dark toggle-pw-btn"
              type="button"
              data-target="pw-new"
              title="Toggle visibility"
            >
              &#x25C9;
            </button>
          </div>
        </div>
        <div>
          <label class="form-label small fw-bold">Confirm New Password</label>
          <div class="input-group">
            <input
              type="password"
              id="pw-confirm"
              class="form-control"
              autocomplete="new-password"
            />
            <button
              class="btn btn-white border-dark toggle-pw-btn"
              type="button"
              data-target="pw-confirm"
              title="Toggle visibility"
            >
              &#x25C9;
            </button>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" id="confirm-change-pw-btn">
          Update Password
        </button>
      </div>
    </div>
  </div>
</div>
