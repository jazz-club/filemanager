<div class="modal fade" id="docModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-xl modal-dialog-centered">
    <div
      class="modal-content border-2 border-dark"
      style="box-shadow: 4px 4px 0 0 #000; border-radius: 8px; overflow: hidden"
    >
      <div
        class="modal-header border-bottom border-dark py-2 px-3 d-flex align-items-center bg-white"
      >
        <div class="d-flex align-items-center gap-2 overflow-hidden flex-grow-1 me-2">
          <img
            src="/src/assets/icons/file-text.png"
            width="18"
            height="18"
            style="image-rendering: pixelated; object-fit: contain; flex-shrink: 0"
            alt=""
          />
          <h5 class="modal-title text-truncate fw-bold mb-0" id="doc-modal-title">
            Document Preview
          </h5>
          <span
            class="badge bg-dark text-white font-monospace ms-2"
            id="doc-lang-badge"
            style="font-size: 0.72rem; border-radius: 4px"
            >TEXT</span
          >
          <span
            class="text-muted small d-none d-sm-inline font-monospace"
            id="doc-meta-stats"
          ></span>
        </div>
        <div class="d-flex align-items-center gap-2 ms-auto">
          <button
            type="button"
            class="btn btn-sm btn-white border border-dark fw-bold py-1 px-2 d-none"
            id="doc-copy-btn"
            title="Copy code"
          >
            <svg
              width="13"
              height="13"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              style="vertical-align: -1px; margin-right: 4px"
            >
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            <span id="doc-copy-text">Copy</span>
          </button>
          <button
            type="button"
            class="btn-close-custom"
            data-bs-dismiss="modal"
            aria-label="Close"
            title="Close"
          >
            ✕
          </button>
        </div>
      </div>
      <div class="modal-body p-0">
        <div id="doc-pdf-container" class="d-none p-3">
          <iframe
            id="doc-pdf-iframe"
            style="width: 100%; height: 75vh; border: none; border-radius: 6px"
          ></iframe>
        </div>
        <div
          id="doc-text-container"
          class="code-preview-scroll-box d-none"
          style="max-height: 75vh; overflow: auto; background: #18181b; color: #f4f4f5"
        ></div>
      </div>
    </div>
  </div>
</div>
