<div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title h5 fw-bold mb-0">Confirm Permanent Deletion</h3>
        <button
          type="button"
          class="btn-close-custom ms-auto"
          data-bs-dismiss="modal"
          aria-label="Close"
          title="Close"
        >
          ✕
        </button>
      </div>
      <div class="modal-body">
        <p class="mb-0">
          Are you sure you want to permanently delete <strong id="delete-file-name">this item</strong>? This cannot be undone.
        </p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-danger" id="confirm-delete-btn">
          Delete Permanently
        </button>
      </div>
    </div>
  </div>
</div>
