<div class="modal fade" id="newFolderModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fw-bold">Create New Folder</h5>
        <button
          type="button"
          class="btn-close-custom ms-auto"
          data-bs-dismiss="modal"
          aria-label="Close"
          title="Close"
        >
          ✕
        </button>
      </div>
      <div class="modal-body">
        <label class="form-label small fw-bold">Folder Name</label>
        <input
          type="text"
          id="new-folder-name"
          class="form-control"
          placeholder="e.g., Bladee, Thaiboy Digital, Ecco2k..."
        />
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" id="create-folder-confirm-btn">Create</button>
      </div>
    </div>
  </div>
</div>
