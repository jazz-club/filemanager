<div class="modal fade" id="allSharesStatsModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
    <div
      class="modal-content border-2 border-dark"
      style="box-shadow: 4px 4px 0 0 #000; border-radius: 8px"
    >
      <div class="modal-header border-bottom border-dark bg-light">
        <h5 class="modal-title fw-bold d-flex align-items-center gap-2">
          <img
            src="/src/assets/icons/lib/SVG/regular/globe.svg"
            width="18"
            height="18"
            alt=""
            style="object-fit: contain"
          />
          <span>Shares</span>
        </h5>
        <button
          type="button"
          class="btn-close-custom ms-auto"
          data-bs-dismiss="modal"
          aria-label="Close"
          title="Close"
        >
          ✕
        </button>
      </div>
      <div class="modal-body p-3">
        <div class="d-flex gap-2 mb-3 flex-wrap">
          <div class="flex-fill p-2 border border-dark rounded text-center" style="min-width: 80px">
            <div class="fw-bold font-monospace fs-5 text-info" id="all-stats-total-links">0</div>
            <div class="text-muted" style="font-size: 0.72rem">Links</div>
          </div>
          <div class="flex-fill p-2 border border-dark rounded text-center" style="min-width: 80px">
            <div class="fw-bold font-monospace fs-5 text-primary" id="all-stats-total-views">0</div>
            <div class="text-muted" style="font-size: 0.72rem">Views</div>
          </div>
          <div class="flex-fill p-2 border border-dark rounded text-center" style="min-width: 80px">
            <div class="fw-bold font-monospace fs-5 text-success" id="all-stats-total-downloads">
              0
            </div>
            <div class="text-muted" style="font-size: 0.72rem">Downloads</div>
          </div>
          <div class="flex-fill p-2 border border-dark rounded text-center" style="min-width: 80px">
            <div class="fw-bold font-monospace fs-5 text-danger" id="all-stats-total-saves">0</div>
            <div class="text-muted" style="font-size: 0.72rem">Saves</div>
          </div>
        </div>

        <div style="overflow-x: auto">
          <div id="all-shares-list">
            <div class="text-muted small text-center py-4">Loading active shares...</div>
          </div>
        </div>
        <div
          id="all-shares-pagination"
          class="shares-pagination d-flex flex-wrap align-items-center justify-content-between gap-2 mt-3"
        >
          <div id="all-shares-pagination-info" class="small text-muted font-monospace">
            Showing 0 links
          </div>
          <div class="shares-pagination-controls d-flex flex-wrap align-items-center gap-2">
            <span id="all-shares-page-indicator" class="small text-muted font-monospace"
              >Page 1 of 1</span
            >
            <button
              type="button"
              id="all-shares-page-prev"
              class="btn btn-sm btn-white border border-dark fw-bold"
              aria-label="Previous shares page"
            >
              ‹ Previous
            </button>
            <button
              type="button"
              id="all-shares-page-next"
              class="btn btn-sm btn-white border border-dark fw-bold"
              aria-label="Next shares page"
            >
              Next ›
            </button>
            <div class="dropdown">
              <button
                type="button"
                id="all-shares-page-size-btn"
                class="toolbar-btn dropdown-toggle"
                data-bs-toggle="dropdown"
                aria-expanded="false"
              >
                25 per page
              </button>
              <ul
                class="dropdown-menu dropdown-menu-end shadow-sm border-dark"
                aria-labelledby="all-shares-page-size-btn"
              >
                <li>
                  <button type="button" class="dropdown-item py-1" data-shares-page-size="10">
                    10 per page
                  </button>
                </li>
                <li>
                  <button type="button" class="dropdown-item py-1" data-shares-page-size="25">
                    25 per page
                  </button>
                </li>
                <li>
                  <button type="button" class="dropdown-item py-1" data-shares-page-size="50">
                    50 per page
                  </button>
                </li>
                <li>
                  <button type="button" class="dropdown-item py-1" data-shares-page-size="100">
                    100 per page
                  </button>
                </li>
              </ul>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer border-top border-dark">
        <button type="button" class="btn btn-danger fw-bold me-auto" id="revoke-all-shares-btn">
          Revoke All
        </button>
        <button
          type="button"
          class="btn btn-success fw-bold border border-dark"
          id="reload-all-stats-btn"
        >
          Refresh
        </button>
      </div>
    </div>
  </div>
</div>
