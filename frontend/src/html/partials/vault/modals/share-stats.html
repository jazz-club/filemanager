<div class="modal fade" id="allSharesStatsModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
    <div
      class="modal-content border-2 border-dark"
      style="box-shadow: 4px 4px 0 0 #000; border-radius: 8px"
    >
      <div class="modal-header border-bottom border-dark bg-light">
        <h5 class="modal-title fw-bold d-flex align-items-center gap-2">
          <img
            src="/src/assets/icons/lib/SVG/regular/globe.svg"
            width="18"
            height="18"
            alt=""
            style="object-fit: contain"
          />
          <span>Share Statistics</span>
        </h5>
        <button
          type="button"
          class="btn-close-custom ms-auto"
          data-bs-dismiss="modal"
          aria-label="Close"
          title="Close"
        >
          ✕
        </button>
      </div>
      <div class="modal-body p-3">
        <div class="d-flex gap-2 mb-3 flex-wrap">
          <div class="flex-fill p-2 border border-dark rounded text-center" style="min-width: 80px">
            <div class="fw-bold font-monospace fs-5" id="all-stats-total-links">0</div>
            <div class="text-muted" style="font-size: 0.72rem">Links</div>
          </div>
          <div class="flex-fill p-2 border border-dark rounded text-center" style="min-width: 80px">
            <div class="fw-bold font-monospace fs-5" id="all-stats-total-views">0</div>
            <div class="text-muted" style="font-size: 0.72rem">Views</div>
          </div>
          <div class="flex-fill p-2 border border-dark rounded text-center" style="min-width: 80px">
            <div class="fw-bold font-monospace fs-5" id="all-stats-total-downloads">0</div>
            <div class="text-muted" style="font-size: 0.72rem">Downloads</div>
          </div>
          <div class="flex-fill p-2 border border-dark rounded text-center" style="min-width: 80px">
            <div class="fw-bold font-monospace fs-5" id="all-stats-total-saves">0</div>
            <div class="text-muted" style="font-size: 0.72rem">Saves</div>
          </div>
          <div class="d-flex align-items-center ms-auto">
            <button
              type="button"
              class="btn btn-sm btn-white border border-dark fw-bold py-0 px-2"
              id="reload-all-stats-btn"
              style="font-size: 0.75rem"
            >
              Refresh
            </button>
          </div>
        </div>

        <div style="overflow-x: auto">
          <div id="all-shares-list">
            <div class="text-muted small text-center py-4">Loading active shares...</div>
          </div>
        </div>
      </div>
      <div class="modal-footer border-top border-dark">
        <button type="button" class="btn btn-danger fw-bold me-auto" id="revoke-all-shares-btn">
          Revoke All
        </button>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>
