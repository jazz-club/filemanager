<div class="modal fade" id="folderColorModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-sm">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fw-bold">Pick Folder Colour</h5>
        <button
          type="button"
          class="btn-close-custom ms-auto"
          data-bs-dismiss="modal"
          aria-label="Close"
          title="Close"
        >
          ✕
        </button>
      </div>
      <div class="modal-body text-center">
        <p class="small text-muted mb-3">Folder accent for <b id="color-folder-name">Folder</b>:</p>
        <div class="d-flex flex-wrap justify-content-center gap-2" id="folder-color-palette"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">
          Cancel
        </button>
      </div>
    </div>
  </div>
</div>
