services:
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "127.0.0.1:7272:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - "${TLS_CERT_DIR:-./nginx/certs}:/etc/nginx/certs:ro"
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - app-net

  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://vault:vault_secret@postgres:5432/vault}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio}
      MINIO_PORT: "${MINIO_PORT:-9000}"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-encrypted-files}
      SESSION_SECRET: ${SESSION_SECRET}
      ENCRYPTION_SALT: ${ENCRYPTION_SALT}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set admin password}
      NODE_ENV: ${NODE_ENV:-development}
      NODE_OPTIONS: "--max-old-space-size=768"
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-5368709120}
      MAX_ACTIVE_UPLOADS: ${MAX_ACTIVE_UPLOADS:-2}
      SHARE_PAGE_PATH: /frontend/src/html/share.html
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - ./backend:/app
      - ./frontend:/frontend:ro
      - /app/node_modules
    mem_limit: 1536m
    cpus: "2.0"
    pids_limit: 128
    init: true
    networks:
      - app-net

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vault_secret}
      POSTGRES_DB: ${POSTGRES_DB:-vault}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vault"]
      interval: 3s
      retries: 10
    networks:
      - app-net

  minio:
    image: pgsty/silo:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9001:9001"
    networks:
      - app-net

volumes:
  pg-data:
  minio-data:

networks:
  app-net:
