version: "3.9"

services:
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "${HOST_PORT:-8443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - app-net

  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://vault:vault_secret@postgres:5432/vault}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio}
      MINIO_PORT: "${MINIO_PORT:-9000}"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-encrypted-files}
      SESSION_SECRET: ${SESSION_SECRET}
      ENCRYPTION_SALT: ${ENCRYPTION_SALT}
      NODE_ENV: ${NODE_ENV:-development}
      NODE_OPTIONS: "--max-old-space-size=4096"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - app-net

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vault_secret}
      POSTGRES_DB: ${POSTGRES_DB:-vault}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vault"]
      interval: 3s
      retries: 10
    networks:
      - app-net

  minio:
    image: pgsty/silo:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_CONSOLE_PORT:-29001}:9001"
    networks:
      - app-net

volumes:
  pg-data:
  minio-data:

networks:
  app-net:
