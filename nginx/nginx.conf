worker_processes 1;

events { worker_connections 128; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    access_log    off;
    error_log     /dev/null;
    client_max_body_size 5250m;
    limit_req_zone $binary_remote_addr zone=csp_report_limit:10m rate=5r/s;

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        add_header X-Content-Type-Options  nosniff;
        add_header X-Frame-Options         DENY;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; report-uri /api/security/csp-report" always;

        location /api/ {
            proxy_pass         http://backend:3000/api/;
            proxy_hide_header  Content-Security-Policy-Report-Only;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            client_max_body_size 5250m;
            client_body_buffer_size 64k;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_connect_timeout 1800s;
            proxy_send_timeout 1800s;
            proxy_read_timeout 1800s;
            client_body_timeout 1800s;
        }

        location = /api/security/csp-report {
            limit_req zone=csp_report_limit burst=20 nodelay;
            proxy_pass         http://backend:3000/api/security/csp-report;
            proxy_hide_header  Content-Security-Policy-Report-Only;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location = /login {
            alias /usr/share/nginx/html/src/html/login.html;
            default_type text/html;
        }

        location = /admin {
            alias /usr/share/nginx/html/src/html/admin.html;
            default_type text/html;
        }

        location = /vault {
            alias /usr/share/nginx/html/src/html/vault.html;
            default_type text/html;
        }

        location = /audit {
            alias /usr/share/nginx/html/src/html/audit.html;
            default_type text/html;
        }

        location ^~ /share/ {
            proxy_pass         http://backend:3000/share/;
            proxy_hide_header  Content-Security-Policy-Report-Only;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }

        location /src/ {
            root /usr/share/nginx/html;
        }

        location / {
            root  /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
